<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="920" viewBox="0 0 1500 920" role="img" aria-labelledby="title desc">
<title id="title">Flujo de desbloqueo y pago</title>
<desc id="desc">Secuencia de desbloqueo de una carga: creación del pago, Checkout Pro, webhook, conciliación y reserva.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <marker id="arrow-start" viewBox="0 0 10 10" refX="1.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M 10 0 L 0 5 L 10 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.07"/>
  </filter>
</defs>
<rect width="1500" height="920" fill="#ffffff"/>
<text x="44" y="52" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f172a" text-anchor="start" >Flujo de desbloqueo y pago</text><text x="44" y="80" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="400" fill="#64748b" text-anchor="start" >Transportista → backend → MercadoPago → Supabase → Dador</text><rect x="1180" y="34" width="183.44000000000003" height="22" rx="11.0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" /><text x="1271.72" y="49.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle" >Camino crítico del negocio</text><rect x="40" y="110" width="220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><circle cx="62" cy="142" r="11" fill="#2563eb"/><text x="80" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Transportista</text><text x="80" y="157" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" >portal web</text><line x1="150" y1="174" x2="150" y2="832" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="340" y="110" width="220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><circle cx="362" cy="142" r="11" fill="#0d9488"/><text x="380" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Backend</text><text x="380" y="157" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" >FastAPI · Cloud Run</text><line x1="450" y1="174" x2="450" y2="832" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="640" y="110" width="220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><circle cx="662" cy="142" r="11" fill="#d97706"/><text x="680" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >MercadoPago</text><text x="680" y="157" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" >Checkout Pro</text><line x1="750" y1="174" x2="750" y2="832" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="940" y="110" width="220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><circle cx="962" cy="142" r="11" fill="#059669"/><text x="980" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Supabase</text><text x="980" y="157" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" >Postgres · Auth</text><line x1="1050" y1="174" x2="1050" y2="832" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="1240" y="110" width="220" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/><circle cx="1262" cy="142" r="11" fill="#7c3aed"/><text x="1280" y="138" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a" text-anchor="start" >Dador</text><text x="1280" y="157" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="start" >portal web</text><line x1="1350" y1="174" x2="1350" y2="832" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 5" /><line x1="230" y1="205" x2="1460" y2="205" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="44" y="193" width="222.08" height="22" rx="11.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="155.04000000000002" y="208.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#0d9488" text-anchor="middle" >1 · Crear la preferencia de pago</text><line x1="150" y1="235" x2="450" y2="235" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="204.64" y="215" width="190.72000000000003" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="300.0" y="228" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle" >POST /payments { load_id }</text><line x1="450" y1="270" x2="750" y2="270" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="484.48" y="250" width="231.04000000000002" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="600.0" y="263" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >crear preferencia (Checkout Pro)</text><line x1="450" y1="305" x2="1050" y2="305" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="664.72" y="285" width="170.56" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="750.0" y="298" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >guardar Payment PENDING</text><line x1="450" y1="340" x2="150" y2="340" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="251.68" y="320" width="96.64000000000001" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="300.0" y="333" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >checkout_url</text><line x1="230" y1="395" x2="1460" y2="395" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="44" y="383" width="170.56" height="22" rx="11.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="129.28" y="398.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#d97706" text-anchor="middle" >2 · Pagar en MercadoPago</text><line x1="150" y1="425" x2="750" y2="425" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="368.08" y="405" width="163.84" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="450.0" y="418" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle" >abrir Checkout y pagar</text><line x1="750" y1="460" x2="450" y2="460" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="511.36" y="440" width="177.28000000000003" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="600.0" y="453" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#d97706" text-anchor="middle" >webhook payment.approved</text><line x1="230" y1="505" x2="1460" y2="505" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="44" y="493" width="151.24" height="22" rx="11.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="119.62" y="508.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#7c3aed" text-anchor="middle" >3 · Confirmar el pago</text><line x1="450" y1="535" x2="750" y2="535" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="437.44" y="515" width="325.12" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="600.0" y="528" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >GET /v1/payments/{id} (verifica firma y monto)</text><line x1="450" y1="570" x2="1050" y2="570" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="688.24" y="550" width="123.52000000000001" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="750.0" y="563" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >Payment APPROVED</text><line x1="150" y1="605" x2="450" y2="605" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="211.35999999999999" y="585" width="177.28000000000003" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="300.0" y="598" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle" >POST /payments/{id}/sync</text><line x1="230" y1="640" x2="1460" y2="640" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="7 5" /><rect x="44" y="628" width="170.56" height="22" rx="11.0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" /><text x="129.28" y="643.025" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#16a34a" text-anchor="middle" >4 · Desbloquear la carga</text><line x1="150" y1="670" x2="450" y2="670" stroke="#2563eb" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="150.88" y="650" width="298.24" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="300.0" y="663" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#2563eb" text-anchor="middle" >POST /loads/{id}/transporters/{tid}/unlock</text><line x1="450" y1="705" x2="750" y2="705" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="544.96" y="685" width="110.08000000000001" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="600.0" y="698" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >revalidar pago</text><line x1="450" y1="740" x2="1050" y2="740" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="647.92" y="720" width="204.16000000000003" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="750.0" y="733" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >Load RESERVED + Notification</text><line x1="450" y1="775" x2="150" y2="775" stroke="#0d9488" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="167.68" y="755" width="264.64" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="300.0" y="768" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#0d9488" text-anchor="middle" >load desbloqueada (datos de contacto)</text><line x1="450" y1="810" x2="1350" y2="810" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="771.04" y="790" width="257.92" height="18" rx="9" fill="#ffffff" stroke="#ffffff" stroke-width="0" /><text x="900.0" y="803" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="12" font-weight="600" fill="#16a34a" text-anchor="middle" >notificación in-app: carga reservada</text><rect x="44" y="848" width="1412" height="40" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" /><text x="64" y="873" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#334155" text-anchor="start" >El backend no confía en el estado que informa el cliente: revalida el pago contra MercadoPago antes de reservar la carga.</text></svg>
