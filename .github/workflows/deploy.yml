name: Deploy mdBook
 
on:
  push:
    branches:
      - main
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
 
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
 
    - name: Install mdBook
      run: cargo install mdbook --version 0.4.37
 
    - name: Build mdBook
      run: mdbook build
 
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./book
